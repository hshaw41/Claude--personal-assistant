name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash ~/always-on-assistant/scripts/deploy.sh

      - name: Notify owner on Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Skipping Telegram notify (BOT_TOKEN or CHAT_ID missing)"
            exit 0
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Deployed $REF @ $SHORT_SHA"
          else
            TEXT="❌ Deploy failed on $REF @ $SHORT_SHA ($STATUS)"
          fi
          curl -sS --fail \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null
